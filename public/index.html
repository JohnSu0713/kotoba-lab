<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kotoba Lab">
  <meta name="description" content="A calm, local-first Japanese learning PWA for Traditional Chinese learners.">
  <title>Kotoba Lab</title>
  <script>
    (() => {
      const preference = localStorage.getItem('kotoba-lab:appearance') || 'system';
      const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.documentElement.dataset.appearance = preference;
      document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    })();
  </script>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./visual-polish.css">
  <link rel="stylesheet" href="./corpus-polish.css">
  <link rel="stylesheet" href="./flashcard-polish.css">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./app/app/main.js"></script>
</body>
</html>
