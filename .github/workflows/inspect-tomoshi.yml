name: Inspect Tomoshi schema

on:
  push:
    branches: [feat/jlpt-corpus]
    paths:
      - '.github/workflows/inspect-tomoshi.yml'
      - 'scripts/inspect_tomoshi.py'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install zstandard
        run: python -m pip install --disable-pip-version-check zstandard
      - name: Download and decompress Tomoshi
        run: |
          python - <<'PY'
          import urllib.request
          import zstandard
          src='https://github.com/tomoshi-app/tomoshi-dict-data/releases/download/v2026-09-02/tomoshi-dict-open.db.zst'
          compressed='/tmp/tomoshi-dict-open.db.zst'
          raw='/tmp/tomoshi-dict-open.db'
          print('downloading', src)
          urllib.request.urlretrieve(src, compressed)
          with open(compressed,'rb') as f, open(raw,'wb') as out:
              zstandard.ZstdDecompressor().copy_stream(f,out)
          print('decompressed')
          PY
      - name: Inspect schema
        run: python scripts/inspect_tomoshi.py
