name: Verify Google audio understanding

on:
  push:
    branches: [fix-audited-kana-lyrics]
    paths:
      - .github/workflows/verify-google-audio.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_TTS_CREDENTIALS_JSON }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Speech-to-Text access
        run: |
          python -m pip install --disable-pip-version-check google-cloud-speech
          git fetch origin audio-assets:refs/remotes/origin/audio-assets
          rm -rf /tmp/audio-assets
          git worktree add --detach /tmp/audio-assets refs/remotes/origin/audio-assets
          python - <<'PY'
          import json
          from pathlib import Path
          from google.cloud import speech

          root = Path("/tmp/audio-assets/audio/ja")
          manifest = json.loads((root / "manifest.json").read_text())
          rel = manifest["profiles"]["kana"]["あ"]
          mp3 = root / Path(rel).name
          content = mp3.read_bytes()

          client = speech.SpeechClient()
          config = speech.RecognitionConfig(
              encoding=speech.RecognitionConfig.AudioEncoding.MP3,
              language_code="ja-JP",
              enable_automatic_punctuation=False,
          )
          response = client.recognize(config=config, audio=speech.RecognitionAudio(content=content))
          text = " ".join(
              result.alternatives[0].transcript
              for result in response.results
              if result.alternatives
          )
          print("STT:", repr(text))
          PY
