name: Verify Google audio understanding

on:
  push:
    branches: [fix-audited-kana-lyrics]
    paths:
      - .github/workflows/verify-google-audio.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test existing Google API key with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FALLBACK_GOOGLE_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
        run: |
          python -m pip install --disable-pip-version-check google-genai
          python - <<'PY'
          import os
          from google import genai

          key = os.environ.get("GEMINI_API_KEY") or os.environ.get("FALLBACK_GOOGLE_API_KEY")
          if not key:
              raise SystemExit("No GEMINI_API_KEY or YOUTUBE_DATA_API_KEY secret is configured")

          client = genai.Client(api_key=key)
          response = client.models.generate_content(
              model="gemini-3.8-flash",
              contents="Reply with exactly AUDIO_VERIFY_OK",
          )
          print("model:", response.text)
          if "AUDIO_VERIFY_OK" not in (response.text or ""):
              raise SystemExit("Unexpected model response")
          PY
