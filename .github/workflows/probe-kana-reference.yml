name: Probe kana acoustic verification

on:
  push:
    branches: [fix-audited-kana-lyrics]
    paths:
      - scripts/audit_kana_reference.py
      - .github/workflows/probe-kana-reference.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_TTS_CREDENTIALS_JSON }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check google-cloud-texttospeech librosa numpy
      - name: Generate production and independent reference voices
        env:
          KOTOBA_KANA_RATE: '0.90'
          KOTOBA_TTS_MIN_REQUEST_INTERVAL: '1.25'
        run: |
          rm -rf /tmp/kana-prod /tmp/kana-ref-d /tmp/kana-ref-w
          GCP_KANA_VOICE=ja-JP-Neural2-B python scripts/generate_hd_audio.py \
            --kana-source src/features/kana/data.ts --output /tmp/kana-prod \
            --scope kana --workers 4 --force
          GCP_KANA_VOICE=ja-JP-Neural2-D python scripts/generate_hd_audio.py \
            --kana-source src/features/kana/data.ts --output /tmp/kana-ref-d \
            --scope kana --workers 4 --force
          GCP_KANA_VOICE=ja-JP-Wavenet-D python scripts/generate_hd_audio.py \
            --kana-source src/features/kana/data.ts --output /tmp/kana-ref-w \
            --scope kana --workers 4 --force
      - name: Classify all 104 production clips against both reference voices
        run: |
          python scripts/audit_kana_reference.py \
            --kana-source src/features/kana/data.ts \
            --production /tmp/kana-prod \
            --reference /tmp/kana-ref-d \
            --reference /tmp/kana-ref-w \
            --max-rank 3
