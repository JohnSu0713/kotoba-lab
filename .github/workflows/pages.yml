name: Deploy Kotoba Lab to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Mount generated HD audio
        run: |
          if git fetch --depth=1 origin audio-assets:refs/remotes/origin/audio-assets; then
            rm -rf public/audio/ja
            mkdir -p public/audio
            git archive refs/remotes/origin/audio-assets audio/ja | tar -x -C public
            echo 'Mounted generated audio-assets branch.'
          else
            echo 'audio-assets branch does not exist yet; browser TTS fallback remains active.'
          fi

      - name: Build
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
