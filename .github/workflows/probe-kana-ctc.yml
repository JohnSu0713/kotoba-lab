name: Probe kana CTC recognition

on:
  push:
    branches: [fix-audited-kana-lyrics]
    paths:
      - .github/workflows/probe-kana-ctc.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_TTS_CREDENTIALS_JSON }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check google-cloud-texttospeech transformers torch librosa soundfile
      - name: Generate kana
        env:
          GCP_KANA_VOICE: ja-JP-Neural2-B
          KOTOBA_KANA_RATE: '0.90'
          KOTOBA_TTS_MIN_REQUEST_INTERVAL: '1.25'
        run: |
          rm -rf /tmp/kana-probe
          python scripts/generate_hd_audio.py \
            --kana-source src/features/kana/data.ts \
            --output /tmp/kana-probe \
            --scope kana \
            --workers 4 \
            --force
      - name: Recognize difficult kana with Japanese CTC model
        run: |
          python - <<'PY'
          import json, re, unicodedata
          from pathlib import Path
          import librosa
          import torch
          from transformers import AutoProcessor, AutoModelForCTC

          failures = "い う お つ ぬ は ひ ふ へ ま み む め も ら る れ ろ を が ぐ げ ご び ぺ きょ しょ ちゃ みゃ みょ りゃ りゅ りょ ぎょ びゃ ぴゃ".split()
          root=Path('/tmp/kana-probe')
          manifest=json.loads((root/'manifest.json').read_text())
          processor=AutoProcessor.from_pretrained('jonatasgrosman/wav2vec2-large-xlsr-53-japanese')
          model=AutoModelForCTC.from_pretrained('jonatasgrosman/wav2vec2-large-xlsr-53-japanese')
          model.eval()

          def norm(s):
              s=unicodedata.normalize('NFKC',s).lower()
              out=[]
              for ch in s:
                  code=ord(ch)
                  if 0x30A1<=code<=0x30F6: out.append(chr(code-0x60))
                  elif 'ぁ'<=ch<='ゖ' or ch=='ー': out.append(ch)
              return ''.join(out)

          ok=0
          for kana in failures:
              path=root/Path(manifest['profiles']['kana'][kana]).name
              audio,_=librosa.load(path,sr=16000,mono=True)
              # Repeat with silence so CTC gets several independent observations.
              silence=torch.zeros(int(0.18*16000)).numpy()
              import numpy as np
              probe=np.concatenate([np.zeros(int(.15*16000)), *sum(([audio,silence] for _ in range(5)),[])])
              inputs=processor(probe,sampling_rate=16000,return_tensors='pt',padding=True)
              with torch.no_grad():
                  logits=model(**inputs).logits
              ids=torch.argmax(logits,dim=-1)
              text=processor.batch_decode(ids)[0]
              heard=norm(text)
              good=kana in heard or (kana=='を' and 'お' in heard) or (kana=='ぢ' and 'じ' in heard) or (kana=='づ' and 'ず' in heard)
              print(kana, '=>', repr(text), repr(heard), 'OK' if good else 'FAIL')
              ok += int(good)
          print('CTC_OK',ok,'/',len(failures))
          PY
