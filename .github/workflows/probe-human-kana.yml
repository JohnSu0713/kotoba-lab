name: Probe human kana audio

on:
  push:
    branches: [fix-audited-kana-lyrics]
    paths:
      - scripts/import_human_kana.py
      - .github/workflows/probe-human-kana.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_TTS_CREDENTIALS_JSON }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --disable-pip-version-check google-cloud-texttospeech
      - name: Generate explicit yoon fallback and import native recordings
        env:
          GCP_KANA_VOICE: ja-JP-Neural2-B
          KOTOBA_KANA_RATE: '0.90'
          KOTOBA_TTS_MIN_REQUEST_INTERVAL: '1.25'
        run: |
          rm -rf /tmp/kana-human
          python scripts/generate_hd_audio.py \
            --kana-source src/features/kana/data.ts \
            --output /tmp/kana-human \
            --scope kana --workers 4 --force
          python scripts/import_human_kana.py \
            --kana-source src/features/kana/data.ts \
            --audio-dir /tmp/kana-human
      - name: Audit all aliases and assets
        run: |
          python scripts/audit_kana_audio.py \
            --kana-source src/features/kana/data.ts \
            --audio-dir /tmp/kana-human
          python scripts/audit_kana_provenance.py \
            --kana-source src/features/kana/data.ts \
            --audio-dir /tmp/kana-human
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/kana-human/manifest.json').read_text())
          assert m['kanaHumanAudio']['count']==71
          assert len(m['profiles']['kana'])==208
          print('HUMAN_KANA_GATE_OK')
          PY
