name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and build
        run: npm run build

      - name: Validate HD audio target manifest
        run: |
          python scripts/generate_hd_audio.py \
            --output /tmp/kotoba-audio-dry-run \
            --scope all \
            --dry-run

      - name: Validate verified lyric catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("public/data/verified-lyrics.json")
          assert path.exists(), "missing verified lyric catalog"
          data = json.loads(path.read_text())
          entries = data.get("entries", [])
          assert len(entries) >= 12, f"only {len(entries)} verified lyric cards"
          assert all(e.get("verificationScore", 0) >= 76 for e in entries)
          assert all(e.get("verificationCommonChars", 0) >= 4 for e in entries)
          assert all(
              0 <= e["previewLineStartSeconds"] < e["previewLineEndSeconds"] <= 30
              for e in entries
          )
          print("VERIFIED_LYRIC_CARDS", len(entries))
          PY
