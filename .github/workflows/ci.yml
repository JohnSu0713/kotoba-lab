name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and build
        run: npm run build

      - name: Validate learning sessions and backup compatibility
        run: npm test

      - name: Validate HD audio target manifest
        run: |
          python scripts/generate_hd_audio.py \
            --output /tmp/kotoba-audio-dry-run \
            --scope all \
            --dry-run

      - name: Validate hiragana example guides
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          total = 0
          translated = 0
          bad = []
          for path in sorted(Path("public/data/vocab").glob("n[1-5].json")):
              pack = json.loads(path.read_text(encoding="utf-8"))
              for item in pack.get("items", []):
                  for example in item.get("examples", []):
                      total += 1
                      kana = str(example.get("kana") or "").strip()
                      if not kana:
                          bad.append((path.name, item.get("id"), "missing kana"))
                      elif re.search(r"[ァ-ヺ一-龯]", kana):
                          bad.append((path.name, item.get("id"), f"non-hiragana guide: {kana}"))
                      if str(example.get("zhTw") or "").strip():
                          translated += 1
                      if "romaji" in example or "en" in example:
                          bad.append((path.name, item.get("id"), "legacy romaji/en field present"))
          print("TOTAL_HIRAGANA_EXAMPLES", total)
          print("CHINESE_TRANSLATED_EXAMPLES", translated)
          if total == 0:
              raise SystemExit("No vocabulary examples found")
          if translated == 0:
              raise SystemExit("No Traditional Chinese example translations found")
          if bad:
              print("INVALID_EXAMPLES", bad[:20])
              raise SystemExit(f"{len(bad)} invalid learner-facing examples")
          PY

      - name: Validate verified lyric catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("public/data/verified-lyrics.json")
          assert path.exists(), "missing verified lyric catalog"
          data = json.loads(path.read_text())
          entries = data.get("entries", [])
          assert len(entries) >= 12, f"only {len(entries)} verified lyric cards"
          assert all(e.get("verificationScore", 0) >= 76 for e in entries)
          assert all(e.get("verificationCommonChars", 0) >= 4 for e in entries)
          assert all(e.get("verificationCoverage", 0) >= 0.78 for e in entries)
          assert all(
              e.get("verificationExactInclusion", False)
              or (
                  e.get("verificationFullScore", 0) >= 82
                  and e.get("verificationScore", 0) >= 86
              )
              for e in entries
          )
          assert all(
              0 <= e["previewLineStartSeconds"] < e["previewLineEndSeconds"] <= 30
              for e in entries
          )
          print("VERIFIED_LYRIC_CARDS", len(entries))
          PY
