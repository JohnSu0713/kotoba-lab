name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and build
        run: npm run build

      - name: Validate learning sessions and backup compatibility
        run: npm test

      - name: Validate HD audio target manifest
        run: |
          python scripts/generate_hd_audio.py \
            --output /tmp/kotoba-audio-dry-run \
            --scope all \
            --dry-run

      - name: Validate example pronunciation guides
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          total = 0
          missing = []
          suspicious = []
          for path in sorted(Path("public/data/vocab").glob("n[1-5].json")):
              pack = json.loads(path.read_text(encoding="utf-8"))
              for item in pack.get("items", []):
                  for example in item.get("examples", []):
                      total += 1
                      romaji = str(example.get("romaji") or "").strip()
                      if not romaji:
                          missing.append((path.name, item.get("id"), example.get("ja")))
                      elif re.search(r"[ぁ-ゖァ-ヺ一-龯]", romaji):
                          suspicious.append((path.name, item.get("id"), romaji))
          print("TOTAL_EXAMPLES", total)
          print("EXAMPLES_WITH_ROMAJI", total - len(missing))
          if total == 0:
              raise SystemExit("No vocabulary examples found")
          if missing:
              print("MISSING_ROMAJI", missing[:20])
              raise SystemExit(f"{len(missing)} examples are missing romaji")
          if suspicious:
              print("NON_LATIN_ROMAJI", suspicious[:20])
              raise SystemExit(f"{len(suspicious)} romaji fields still contain Japanese script")
          PY

      - name: Validate verified lyric catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("public/data/verified-lyrics.json")
          assert path.exists(), "missing verified lyric catalog"
          data = json.loads(path.read_text())
          entries = data.get("entries", [])
          assert len(entries) >= 12, f"only {len(entries)} verified lyric cards"
          assert all(e.get("verificationScore", 0) >= 76 for e in entries)
          assert all(e.get("verificationCommonChars", 0) >= 4 for e in entries)
          assert all(e.get("verificationCoverage", 0) >= 0.78 for e in entries)
          assert all(
              e.get("verificationExactInclusion", False)
              or (
                  e.get("verificationFullScore", 0) >= 82
                  and e.get("verificationScore", 0) >= 86
              )
              for e in entries
          )
          assert all(
              0 <= e["previewLineStartSeconds"] < e["previewLineEndSeconds"] <= 30
              for e in entries
          )
          print("VERIFIED_LYRIC_CARDS", len(entries))
          PY
