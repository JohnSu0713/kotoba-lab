name: Refresh vocabulary data

on:
  workflow_dispatch:
  push:
    branches: [main, feat/example-audio-romaji]
    paths:
      - scripts/import_tomoshi.py
      - .github/workflows/refresh-vocab.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            zstandard \
            opencc-python-reimplemented \
            cutlet \
            'fugashi[unidic-lite]'

      - name: Download pinned dictionary and example sources
        run: |
          python - <<'PY'
          import urllib.request
          import zstandard
          source='https://github.com/tomoshi-app/tomoshi-dict-data/releases/download/v2026-09-02/tomoshi-dict-open.db.zst'
          compressed='/tmp/tomoshi-dict-open.db.zst'
          raw='/tmp/tomoshi-dict-open.db'
          urllib.request.urlretrieve(source, compressed)
          with open(compressed,'rb') as src, open(raw,'wb') as dst:
              zstandard.ZstdDecompressor().copy_stream(src,dst)
          PY
          curl -L --fail --retry 3 -o /tmp/jld-words.json \
            https://raw.githubusercontent.com/jkindrix/japanese-language-data/main/data/core/words.json
          curl -L --fail --retry 3 -o /tmp/cmn_sentences.tsv.bz2 \
            https://downloads.tatoeba.org/exports/per_language/cmn/cmn_sentences.tsv.bz2
          curl -L --fail --retry 3 -o /tmp/jpn-cmn_links.tsv.bz2 \
            https://downloads.tatoeba.org/exports/per_language/jpn/jpn-cmn_links.tsv.bz2

      - name: Generate enriched JLPT packs
        run: |
          python scripts/import_tomoshi.py \
            --db /tmp/tomoshi-dict-open.db \
            --output public/data/vocab \
            --examples /tmp/jld-words.json \
            --cmn-sentences /tmp/cmn_sentences.tsv.bz2 \
            --cmn-links /tmp/jpn-cmn_links.tsv.bz2
          cat public/data/vocab/manifest.json

      - name: Validate example pronunciation guides
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          total = 0
          missing = []
          for path in sorted(Path("public/data/vocab").glob("n[1-5].json")):
              pack = json.loads(path.read_text(encoding="utf-8"))
              for item in pack.get("items", []):
                  for example in item.get("examples", []):
                      total += 1
                      if not str(example.get("romaji") or "").strip():
                          missing.append((path.name, item.get("id"), example.get("ja")))
          print("EXAMPLES_WITH_PRONUNCIATION_GUIDE", total - len(missing))
          print("TOTAL_EXAMPLES", total)
          if total == 0:
              raise SystemExit("No examples found in generated vocabulary packs")
          if missing:
              for row in missing[:20]:
                  print("MISSING", row)
              raise SystemExit(f"{len(missing)} examples are missing romaji")
          PY

      - name: Commit generated vocabulary packs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/vocab
          if git diff --cached --quiet; then
            echo 'Vocabulary packs already current.'
          else
            git commit -m 'data: refresh enriched JLPT vocabulary cards'
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
