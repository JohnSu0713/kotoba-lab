name: Probe Commons kana recordings

on:
  push:
    branches: [fix-audited-kana-lyrics]
    paths:
      - scripts/probe_commons_kana.py
      - .github/workflows/probe-commons-kana.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python scripts/probe_commons_kana.py
