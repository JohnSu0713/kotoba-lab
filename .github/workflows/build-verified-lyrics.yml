name: Build verified lyric catalog

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - scripts/generate_verified_lyrics.py
      - .github/workflows/build-verified-lyrics.yml

permissions:
  contents: write

concurrency:
  group: verified-lyrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install verifier
        run: python -m pip install --disable-pip-version-check requests faster-whisper rapidfuzz

      - name: Build audio-verified catalog
        run: |
          python scripts/generate_verified_lyrics.py \
            --output public/data/verified-lyrics.json \
            --per-artist 6 \
            --model small

      - name: Validate catalog
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          data = json.loads(Path("public/data/verified-lyrics.json").read_text())
          entries = data.get("entries", [])
          assert len(entries) >= 12, f"only {len(entries)} verified entries"
          assert all(e["verificationScore"] >= 76 for e in entries)
          assert all(e["verificationCommonChars"] >= 4 for e in entries)
          assert all(e.get("verificationCoverage", 0) >= 0.78 for e in entries)
          assert all(
              e.get("verificationExactInclusion", False)
              or (
                  e.get("verificationFullScore", 0) >= 82
                  and e.get("verificationScore", 0) >= 86
              )
              for e in entries
          )
          assert all(
              0 <= e["previewLineStartSeconds"] < e["previewLineEndSeconds"] <= 30
              for e in entries
          )
          counts = Counter(e["artistName"] for e in entries)
          assert any(
              "Vaundy" in e.get("artistAliases", [])
              for e in entries
          ), "Vaundy has no audio-verified cards"
          print("VERIFIED_ENTRIES", len(entries))
          print("COUNTS", dict(counts))
          PY

      - name: Commit verified catalog
        if: github.event_name == 'workflow_dispatch' || github.ref_name != 'main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/verified-lyrics.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged"
          else
            git commit -m "lyrics: refresh audio-verified catalog"
            git fetch origin ${{ github.ref_name }}
            git rebase origin/${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }}
          fi
